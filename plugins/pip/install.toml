match = "pip install"

[optimize]
optimize_stderr = true
truncate = "bottom"
max_lines = 150
strip = [
    "^\\s*Collecting ",
    "^\\s*Downloading ",
    "^\\s*Using cached ",
    "^\\s*Requirement already satisfied",
    "^\\s*Preparing metadata",
    "^\\s*Installing collected packages",
    "^\\s*$",
]
