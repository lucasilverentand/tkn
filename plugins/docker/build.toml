match = "docker build"

[optimize]
truncate = "bottom"
strip = [
    "^#\\d+ \\[internal\\]",       # internal build steps
    "^#\\d+ sha256:",
    "^#\\d+ DONE ",
    "^#\\d+ CACHED",
    "^#\\d+ extracting ",
    "^#\\d+ transferring ",
    "^#\\d+ resolve ",
]
keep = [
    "(?i)error",
    "(?i)warning",
    "^#\\d+ ERROR",
    "exporting to image",
    "naming to ",
]
