match = "git log"

[transform]
add = [
    "--oneline|--pretty|--format",
    "-20|-n|--max-count",
    "--no-color|--color|--color=never|--color=always|--color=auto",
]
savings_factor = 10.0

[optimize]
truncate = "top"
strip = [
    "^commit [a-f0-9]",
    "^Author:",
    "^Date:",
    "^Merge:",
    "^gpg:",
    "^Primary key fingerprint:",
    "^\\s*$",
]
max_lines = 100

# Shorten full 40-char commit hashes to 7-char abbreviations
[[optimize.replace]]
pattern = "^([a-f0-9]{7})[a-f0-9]{33} "
replacement = "$1 "
