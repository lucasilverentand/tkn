match = "git diff"

[transform]
add = ["--no-color|--color|--color=never|--color=always|--color=auto"]
savings_factor = 3.0

[optimize]
truncate = "bottom"
strip = [
    "^\\s*$",
    "^diff --git ",
    "^index [a-f0-9]",
    "^(old|new) mode ",
    "^(new file|deleted file) mode ",
    "^similarity index ",
    "^rename (from|to) ",
    "^copy (from|to) ",
    "^--- [ab]/",
    "^\\+\\+\\+ [ab]/",
    "^\\\\ No newline at end of file",
    "^Binary files .* differ$",
    "^GIT binary patch$",
    "^literal \\d+",
    "^delta \\d+",
    "^[A-Za-z][a-f0-9]{39,}$",
]
max_lines = 300

# Strip function/class context from hunk headers, keep only line range
[[optimize.replace]]
pattern = "^(@@ -\\d+,?\\d* \\+\\d+,?\\d* @@).*"
replacement = "$1"
