match = "git diff"

[transform]
add = ["--no-color|--color|--color=never|--color=always|--color=auto"]

[optimize]
truncate = "bottom"
strip = [
    "^diff --git ",
    "^index [a-f0-9]",
    "^(old|new) mode ",
    "^similarity index ",
    "^rename (from|to) ",
    "^copy (from|to) ",
    "^--- [ab]/",
    "^\\+\\+\\+ [ab]/",
    "^\\\\ No newline at end of file",
]
max_lines = 300
