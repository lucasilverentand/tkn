match = "git stash"

[optimize]
truncate = "top"
strip = [
    # Usage help boilerplate
    "^usage: git stash",
    "^   or: git stash",
    "^\\s+\\[--pathspec",
    "^\\s+\\[--\\] \\[<pathspec",
    "^\\s+\\[-u \\| --include",
    "^\\s+\\[-a \\| --all\\]",
    "^\\s+\\[\\(-m \\|",
    # Option descriptions
    "^\\s+-[a-zA-Z], --\\[?no-\\]?",
    "^\\s+--\\[no-\\]",
    "^\\s{20,}",
    # Auto-merging noise
    "^Auto-merging ",
    # Git hints
    "^\\(use \"git ",
    # Status boilerplate from stash pop conflicts
    "^On branch ",
    "^Your branch is ",
    "^Untracked files:",
    "^Changes not staged",
    "^no changes added",
]
max_lines = 50
