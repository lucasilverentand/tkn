match = "git branch"

[transform]
add = ["--no-color|--color|--color=never|--color=always|--color=auto"]

[optimize]
truncate = "top"
max_lines = 50
strip = [
    "^\\s*remotes/origin/HEAD ",    # HEAD pointer
    "^\\s*$",
]

# Strip remotes/origin/ prefix (redundant)
[[optimize.replace]]
pattern = "remotes/origin/"
replacement = ""
