match = "git pull"

[optimize]
truncate = "bottom"
max_lines = 100
strip = [
    "^Enumerating objects:",
    "^Counting objects:",
    "^Compressing objects:",
    "^Total \\d+",
    "^remote: Enumerating objects:",
    "^remote: Counting objects:",
    "^remote: Compressing objects:",
    "^remote: Total \\d+",
    "^Unpacking objects:",
    "^From .+$",
]
