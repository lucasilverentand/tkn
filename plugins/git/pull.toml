match = "git pull"

[optimize]
optimize_stderr = true
truncate = "bottom"
max_lines = 100
strip = [
    "^\\s*$",
    "^Enumerating objects:",
    "^Counting objects:",
    "^Compressing objects:",
    "^Total \\d+",
    "^remote: Enumerating objects:",
    "^remote: Counting objects:",
    "^remote: Compressing objects:",
    "^remote: Total \\d+",
    "^Unpacking objects:",
    "^From .+$",
    "^Receiving objects:",
    "^Resolving deltas:",
]
