match = "git push"

[transform]
add = ["--no-color|--color|--color=never|--color=always|--color=auto"]

[optimize]
truncate = "bottom"
max_lines = 100
strip = [
    "^Enumerating objects:",
    "^Counting objects:",
    "^Compressing objects:",
    "^Writing objects:",
    "^Delta compression ",
    "^Total \\d+",
    "^remote: Resolving deltas:",
    "^remote:\\s*$",
    "^remote:.*vulnerabilit",
    "^remote:\\s+https://",
    "^hint:",
]
