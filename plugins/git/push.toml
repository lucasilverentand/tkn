match = "git push"

[optimize]
optimize_stderr = true
truncate = "bottom"
max_lines = 50
strip = [
    "^Enumerating objects:",
    "^Counting objects:",
    "^Compressing objects:",
    "^Writing objects:",
    "^Delta compression ",
    "^Total \\d+",
    "^remote: Resolving deltas:",
    "^remote:\\s*$",
    "^remote:.*vulnerabilit",
    "^remote:\\s+https://",
    "^remote: This repository moved",
    "^remote: Create a pull request",
    "^hint:",
    "^\\s*$",
]
