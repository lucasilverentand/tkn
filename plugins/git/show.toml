match = "git show"

[transform]
add = ["--no-color|--color|--color=never|--color=always|--color=auto"]

[optimize]
strip = [
    "^commit [a-f0-9]",
    "^Author:",
    "^Date:",
    "^Merge:",
    "^diff --git ",
    "^index [a-f0-9]",
    "^(old|new) mode ",
    "^(new file|deleted file) mode ",
    "^similarity index ",
    "^rename (from|to) ",
    "^copy (from|to) ",
    "^--- [ab]/",
    "^\\+\\+\\+ [ab]/",
    "^\\\\ No newline at end of file",
]
max_lines = 150
