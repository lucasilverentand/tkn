match = "git show"

[transform]
add = ["--no-color|--color|--color=never|--color=always|--color=auto"]
savings_factor = 2.0

[optimize]
strip = [
    "^\\s*$",
    "^commit [a-f0-9]",
    "^Author:",
    "^Date:",
    "^Merge:",
    "^gpg:",
    "^Primary key fingerprint:",
    "^diff --git ",
    "^index [a-f0-9]",
    "^(old|new) mode ",
    "^(new file|deleted file) mode ",
    "^similarity index ",
    "^rename (from|to) ",
    "^copy (from|to) ",
    "^--- [ab]/",
    "^\\+\\+\\+ [ab]/",
    "^\\\\ No newline at end of file",
    "^Binary files .* differ$",
    "^GIT binary patch$",
    "^literal \\d+",
    "^delta \\d+",
    "^[A-Za-z][a-f0-9]{39,}$",
]
max_lines = 150

# Strip function/class context from hunk headers
[[optimize.replace]]
pattern = "^(@@ -\\d+,?\\d* \\+\\d+,?\\d* @@).*"
replacement = "$1"
