match = "bun install"

[optimize]
optimize_stderr = true
truncate = "bottom"
max_lines = 150
strip = [
    "^\\s*$",
    # Package resolution/download progress
    "^\\$ bun install",
    "^Resolving\\.\\.\\.",
    "^Resolved,? ",
    "^\\+ .+@\\d",           # individual package added lines
    "^Saved lockfile",
]
