match = "find"

[optimize]
truncate = "top"
strip = [
    "Permission denied",
    "/\\.git/",
    "/node_modules/",
    "/__pycache__/",
    "\\.DS_Store$",
    "Thumbs\\.db$",
    "/\\.next/",
    "/target/",
    "/dist/",
    "/\\.cache/",
    "/\\.turbo/",
    "/coverage/",
    "/\\.pytest_cache/",
    "/\\.mypy_cache/",
    "/\\.tox/",
    "/\\.venv/",
    "/venv/",
    "/\\.nyc_output/",
    "/\\.idea/",
    "/\\.vscode/",
    "/\\.eggs/",
    "\\.egg-info/",
    "/build/",
    "/out/",
]
max_lines = 150
