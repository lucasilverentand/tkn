match = "ls"

[transform]
add = [
    "-1|-l",  # one-per-line unless long format requested
    "-h",     # human-readable sizes (harmless without -l)
]
# -1 normalizes format but doesn't reduce bytes; no savings_factor

[optimize]
truncate = "top"
strip = [
    # "total N" header in long format
    "^total \\d+",
    # . and .. entries (long format)
    "^[dlcbps-][rwxsStT@+-]{9}.*\\s\\.{1,2}$",
    # . and .. entries (short/one-per-line format)
    "^\\.{1,2}$",
    # OS artifacts
    "(?i)\\.DS_Store$",
    "(?i)Thumbs\\.db$",
    "(?i)desktop\\.ini$",
    "__MACOSX$",
    "\\.Spotlight-V100$",
    "\\.fseventsd$",
    "\\.Trashes$",
    # Development noise directories
    "\\bnode_modules$",
    "\\b\\.git$",
    "\\btarget$",
    "\\b__pycache__$",
    "\\b\\.next$",
    "\\b\\.cache$",
    "\\b\\.turbo$",
    "\\b\\.pytest_cache$",
    "\\b\\.mypy_cache$",
    "\\b\\.venv$",
    "\\bcoverage$",
    "\\b\\.nyc_output$",
    "\\b\\.idea$",
    "\\b\\.vscode$",
    "\\b\\.build$",
    "\\bDerived$",
    "\\b\\.swiftpm$",
    "\\bPods$",
    "\\b\\.gradle$",
    "\\bdist$",
    "\\b\\.tox$",
]
max_lines = 50

# Strip metadata columns from long-format lines, keeping only size + date + name
[[optimize.replace]]
pattern = "^[dlcbps-][rwxsStT@+-]{9}[.@+]?\\s+\\d+\\s+\\S+\\s+\\S+\\s+"
replacement = ""

# Strip date/time from size+date+name format, keeping just size and name
[[optimize.replace]]
pattern = "(\\d+\\.?\\d*[KMGTP]?B?)\\s+\\w{3}\\s+\\d{1,2}\\s+[\\d:]+\\s+"
replacement = "$1 "

# Strip Unicode Private Use Area characters (Nerd Font / eza / lsd icons)
[[optimize.replace]]
pattern = "[\\x{E000}-\\x{F8FF}]\\s?"
replacement = ""

# Shorten home directory paths to ~/
[[optimize.replace]]
pattern = "/(Users|home)/[^/]+/"
replacement = "~/"
