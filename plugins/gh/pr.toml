match = "gh pr"

[optimize]
optimize_stderr = true
max_lines = 200
strip = [
    "^—+$",
    "^-+$",
    "^View this pull request on GitHub:",
    "^No description provided\\.",
    "^\\s+$",
    "https://github\\.com/.*/runs/\\d+",
    "^\\s*Merging is blocked",
    "^\\s*Co-Authored-By:",
    "^\\s*Generated with",
]
