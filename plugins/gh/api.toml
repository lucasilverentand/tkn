match = "gh api"

[optimize]
optimize_stderr = true
compact_json = true
max_lines = 150
strip = [
    "\"\\w+_url\":\\s",
    "\"node_id\":\\s",
    "\"gravatar_id\":\\s",
    "\"avatar_url\":\\s",
    "\"site_admin\":\\s",
    "\"permissions\":\\s",
    "\"type\":\\s*\"User\"",
    "\"events_url\":",
    "\"received_events_url\":",
    "\"followers_url\":",
    "\"following_url\":",
    "\"gists_url\":",
    "\"starred_url\":",
    "\"subscriptions_url\":",
    "\"organizations_url\":",
    "\"repos_url\":",
    "\"html_url\":",
    "\"url\":",
    "\"id\":\\s*\\d+",
]
