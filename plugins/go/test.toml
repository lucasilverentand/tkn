match = "go test"

[optimize]
optimize_stderr = true
truncate = "bottom"
max_lines = 200
strip = [
    "^\\s*$",
    "^--- PASS:",
    "^ok\\s+\\S+\\s+\\d",       # ok package 0.123s (passing package summary)
    "^=== RUN\\s",
    "^=== PAUSE\\s",
    "^=== CONT\\s",
    "^\\?\\s+\\S+\\s+\\[no test files\\]",
]
