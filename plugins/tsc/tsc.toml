match = "tsc"

[optimize]
optimize_stderr = true
truncate = "bottom"
max_lines = 150
strip = [
    "^\\s*$",
    "^\\s+Overload \\d+ of \\d+,",           # duplicate overload error noise
    "^The following changes are being made",  # tsconfig modification notice
    "^\\s+The expected type comes from",       # type inference hint
]
