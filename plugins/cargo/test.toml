match = "cargo test"

[optimize]
truncate = "bottom"
max_lines = 150
strip = [
    "^test .+ \\.\\.\\. ok$",
    "^\\s*Finished\\s",
    "^\\s*Compiling\\s",
    "^\\s*Checking\\s",
    "^\\s*Locking\\s",
    "^\\s*Running\\s+(unittests|tests)\\s",
    "^\\s*Doc-tests\\s",
    "^\\s*Downloading\\s",
    "^\\s*Downloaded\\s",
    "^running \\d+ tests?$",
    "^\\s*Fresh\\s",
    "^\\s*Blocking waiting for",
    "^\\s*Waiting on\\s",
    "^\\s*warning:.*unused",
    "^\\s*= help:",
    "^\\s*= note:",
    "^\\s*Packaging\\s",
    "^\\s*Updating\\s",
    "^\\s*Parsing\\s",
    "^\\s*$",
]
