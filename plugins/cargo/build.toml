match = "cargo build"

[optimize]
optimize_stderr = true
truncate = "bottom"
max_lines = 200
strip = [
    "^\\s*Compiling\\s",
    "^\\s*Checking\\s",
    "^\\s*Downloading\\s",
    "^\\s*Downloaded\\s",
    "^\\s*Finished\\s",
    "^\\s*Fresh\\s",
    "^\\s*Locking\\s",
    "^\\s*Blocking waiting for",
    "^\\s*Updating\\s",
]
keep = [
    "(?i)error",
    "(?i)warning",
]
