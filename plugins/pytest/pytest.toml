match = "pytest"

[transform]
add = ["--tb=short|--tb", "-q|--quiet|-v|--verbose"]
savings_factor = 2.0

[optimize]
truncate = "bottom"
max_lines = 200
strip = [
    "^=+ test session starts =+$",
    "^platform ",
    "^rootdir:",
    "^configfile:",
    "^plugins:",
    "^collected \\d+ items?",
    "^\\s*$",
    "^PASSED",
]
