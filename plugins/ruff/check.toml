match = "ruff check"

[transform]
add = ["--no-color|--color"]

[optimize]
optimize_stderr = true
truncate = "bottom"
max_lines = 150
strip = [
    "^All checks passed!$",
    "^Found \\d+ errors?\\.$",       # redundant when individual errors shown
    "^\\[\\*\\] \\d+ fixable with",   # fixable hint
]
