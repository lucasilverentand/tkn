[package]
name = "tkn"
version = "0.4.0"
edition = "2021"
description = "Shell proxy for token-optimized AI tool output"
license = "MIT"
repository = "https://github.com/lucasilverentand/tkn"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
regex = "1"
toml = "0.9"

[profile.release]
strip = true
lto = true
